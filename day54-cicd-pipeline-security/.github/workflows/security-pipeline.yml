name: Secure CI/CD Pipeline

on:
  push:
    paths:
      - "day54-cicd-pipeline-security/**"
      - ".github/workflows/security-pipeline.yml"
  pull_request:
    paths:
      - "day54-cicd-pipeline-security/**"
      - ".github/workflows/security-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-sast:
    name: Unit tests and SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day54-cicd-pipeline-security
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Install Bandit and pip-audit
        run: python -m pip install --upgrade bandit pip-audit
      - name: Static application security testing
        run: bandit -q -r app.py -ll
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Scan repository for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2

  filesystem-and-iac-scan:
    name: Scan files and configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Trivy filesystem, dependency and secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: day54-cicd-pipeline-security
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: day54-cicd-pipeline-security
          severity: HIGH,CRITICAL
          exit-code: "1"

  container-scan:
    name: Build and scan container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build demo image
        run: docker build -t day54-secure-demo:ci ./day54-cicd-pipeline-security
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: day54-secure-demo:ci
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
