name: Day 55 Production Capstone CI

on:
  push:
    paths:
      - "day55-production-capstone/**"
      - ".github/workflows/day55-production-capstone.yml"
  pull_request:
    paths:
      - "day55-production-capstone/**"
      - ".github/workflows/day55-production-capstone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day55-production-capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day55-production-capstone/app/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt pyyaml
      - name: Unit tests
        run: python -m pytest -v app/test_app.py
      - name: SAST with Bandit
        run: bandit -r app -x app/test_app.py
      - name: Dependency vulnerability audit
        run: pip-audit -r app/requirements.txt
      - name: Build container image
        run: docker build -t production-capstone:ci .
      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: production-capstone:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Validate Kubernetes YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path("k8s").glob("*.yaml")):
              with path.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
              print(f"Valid YAML: {path}")
          PY
