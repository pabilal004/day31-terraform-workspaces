name: Day 55 Production Capstone CI

on:
  push:
    paths:
      - "day55-production-capstone/**"
      - ".github/workflows/day55-production-capstone.yml"
  pull_request:
    paths:
      - "day55-production-capstone/**"
      - ".github/workflows/day55-production-capstone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day55-production-capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day55-production-capstone/app/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -v app/test_app.py
      - name: SAST with Bandit
        run: bandit -r app -x app/test_app.py
      - name: Dependency vulnerability audit
        run: pip-audit -r app/requirements.txt
      - name: Build container image
        run: docker build -t production-capstone:ci .
      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/k8s:/work" -w /work bitnami/kubectl:latest \
            apply --dry-run=client -f namespace.yaml -f deployment.yaml -f service.yaml -f hpa.yaml
