name: Day 57 Kubernetes Manifest Validation

on:
  push:
    paths:
      - "day55-production-capstone/k8s/**"
      - ".github/workflows/day57-kubernetes-validation.yml"
  pull_request:
    paths:
      - "day55-production-capstone/k8s/**"
      - ".github/workflows/day57-kubernetes-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate namespace, Deployment, Service, and HPA schemas
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:latest \
            -strict -summary \
            day55-production-capstone/k8s/namespace.yaml \
            day55-production-capstone/k8s/deployment.yaml \
            day55-production-capstone/k8s/service.yaml \
            day55-production-capstone/k8s/hpa.yaml
