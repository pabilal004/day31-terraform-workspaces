name: CI and Kubernetes Manifest Validation

on:
  push:
    paths:
      - "day43-kubernetes-namespaces/*.yaml"
      - "day45-ci-pipeline/**"
      - ".github/workflows/kubernetes-validation.yml"
  pull_request:
    paths:
      - "day43-kubernetes-namespaces/*.yaml"
      - "day45-ci-pipeline/**"
      - ".github/workflows/kubernetes-validation.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: day45-ci-pipeline
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        working-directory: day45-ci-pipeline
        run: python -m pytest -v

  validate-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Validate Kubernetes YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("day43-kubernetes-namespaces/nginx-dev.yaml"),
              Path("day43-kubernetes-namespaces/nginx-staging.yaml"),
              Path("day43-kubernetes-namespaces/nginx-production.yaml"),
          ]

          for file in files:
              with file.open(encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)

              required = ("apiVersion", "kind", "metadata")
              missing = [key for key in required if key not in document]
              if missing:
                  raise SystemExit(f"{file}: missing required top-level fields: {missing}")

              metadata = document["metadata"] or {}
              for key in ("name", "namespace"):
                  if not metadata.get(key):
                      raise SystemExit(f"{file}: metadata.{key} is required")

              print(f"PASS: {file} ({document['kind']}/{metadata['name']}, namespace={metadata['namespace']})")
          PY
