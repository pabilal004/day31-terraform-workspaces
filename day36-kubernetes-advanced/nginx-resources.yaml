apiVersion: v1
kind: Pod
metadata:
  name: nginx-resources
  namespace: day36-dev
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
