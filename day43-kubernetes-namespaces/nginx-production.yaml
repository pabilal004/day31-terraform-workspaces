apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-production
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-production
  template:
    metadata:
      labels:
        app: nginx-production
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - containerPort: 80
