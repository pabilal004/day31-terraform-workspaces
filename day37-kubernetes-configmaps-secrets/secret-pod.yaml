apiVersion: v1
kind: Pod
metadata:
  name: secret-test
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sh", "-c", "test -n \"$DB_PASSWORD\" && echo 'Secret loaded successfully' && sleep 3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
