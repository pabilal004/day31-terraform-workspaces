alertmanager:
  enabled: true

grafana:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 128Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi
    retention: 6h
