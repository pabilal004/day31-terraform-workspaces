alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m

    inhibit_rules:
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info

      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = warning
        target_matchers:
          - severity = info

      - equal:
          - namespace
        source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info

      - target_matchers:
          - alertname = InfoInhibitor

    route:
      receiver: "default-receiver"
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - severity="critical"
          receiver: "critical-receiver"

        - matchers:
            - severity="warning"
          receiver: "warning-receiver"

    receivers:
      - name: "default-receiver"
      - name: "critical-receiver"
      - name: "warning-receiver"

grafana:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 128Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi
    retention: 6h
